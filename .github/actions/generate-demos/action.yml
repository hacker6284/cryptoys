name: Generate demos
description: Build sudoc, run primitive JS tests, emit demos JS and SPEC copies

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: hacker6284/sudocode
        path: .sudocode
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: .sudocode/sudoc
    - name: Build sudoc
      shell: bash
      run: cargo build --release --manifest-path .sudocode/sudoc/Cargo.toml
    - name: Test the primitives and generate the demos
      shell: bash
      run: |
        export SUDOC="$GITHUB_WORKSPACE/.sudocode/sudoc/target/release/sudoc"
        sh tools/generate-demos.sh
