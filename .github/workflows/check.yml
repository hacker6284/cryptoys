name: check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hacker6284/sudocode
          path: .sudocode
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sudocode/sudoc
      - name: Build sudoc
        run: cargo build --release --manifest-path .sudocode/sudoc/Cargo.toml
      - name: Test the primitives
        run: |
          sudoc=.sudocode/sudoc/target/release/sudoc
          "$sudoc" build --target js --tests -o /tmp/scramble-test primitives/hash/scramble/scramble.sudo
          node /tmp/scramble-test/_scramble_impl.mjs
          "$sudoc" build --target js --tests -o /tmp/megadreifach-test primitives/hash/megadreifach/megadreifach.sudo
          node /tmp/megadreifach-test/_megadreifach_impl.mjs
          "$sudoc" build --target js --tests -o /tmp/twodeck-test primitives/cipher/twodeck/twodeck.sudo
          node /tmp/twodeck-test/_twodeck_impl.mjs
      - name: Generate the demos
        run: |
          sudoc=.sudocode/sudoc/target/release/sudoc
          mkdir -p demos/scramble/generated demos/twodeck/generated
          "$sudoc" build --target js -o demos/scramble/generated primitives/hash/scramble/scramble.sudo
          cp primitives/hash/scramble/SPEC.md demos/scramble/SPEC.md
          "$sudoc" build --target js -o demos/twodeck/generated primitives/cipher/twodeck/twodeck.sudo
          cp primitives/cipher/twodeck/SPEC.md demos/twodeck/SPEC.md
          node primitives/cipher/twodeck/encoding.test.mjs
