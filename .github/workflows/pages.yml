# Publishes the generated demos tree to gh-pages (site root = demos/).
# Render static site `cryptoys` deploys from main and must run the same
# generate path (tools/render-build.sh → tools/generate-demos.sh) before
# publishing demos/. See .github/RENDER.md.
#
# Own group so the newest main wins. Only the deploy joins the shared
# `pages` group (republish-pages.yml).

name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/generate-demos
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: demos
          retention-days: 1

  publish-branch:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # One pending job per group by default, and these writes differ,
      # so queue instead of replacing each other.
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: demos
      # Snapshot pr/ inside this job: it holds gh-pages-publish, so nothing
      # can land between the copy and the push.
      - name: Keep existing PR previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/gh-pages >/dev/null; then
            echo "gh-pages does not exist yet; no previews to keep"
            exit 0
          fi
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .gh-pages
          if [ -d .gh-pages/pr ]; then
            rm -rf demos/pr
            cp -a .gh-pages/pr demos/pr
          fi
      - name: Publish site tree to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demos
          keep_files: false
          force_orphan: false
          commit_message: "Publish demos (${{ github.sha }})"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  deploy:
    needs: publish-branch
    # Least privilege for the deploy: read gh-pages, deploy Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/republish-pages.yml
