name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/generate-demos
      - name: Keep existing PR previews
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages
      - name: Restore pr/ into the site
        run: |
          if [ -d .gh-pages/pr ]; then
            rm -rf demos/pr
            cp -a .gh-pages/pr demos/pr
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demos
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: demos
          retention-days: 1

  publish-branch:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: demos
      - name: Publish site tree to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demos
          keep_files: false
          force_orphan: false
          commit_message: "Publish demos (${{ github.sha }})"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
