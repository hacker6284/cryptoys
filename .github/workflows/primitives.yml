name: primitives

# Sudo conformance on PRs. pages.yml still deploys only from main/master.
on:
  pull_request:
    paths:
      - "primitives/**"
      - ".github/actions/generate-demos/**"
      - ".github/workflows/primitives.yml"
  push:
    paths:
      - "primitives/**"
      - ".github/actions/generate-demos/**"
      - ".github/workflows/primitives.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sudo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/generate-demos
