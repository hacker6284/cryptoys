name: proofs-heavy

# Heavy kernel witnesses that are not default build targets, so the normal jobs
# in proofs.yml stay fast:
#   - doubledeal-security-heavy: lean_lib DoubleDealSecurityHeavy of the DoubleDeal
#     security package;
#   - megadreifach-heavy: lean_lib MegaDreifachHeavy (the 8 hash KATs as kernel
#     `decide!` theorems about Generated.v_Hash, about 8 min of kernel time);
#   - megadreifach-attack-logs: the MegaDreifach attack scripts (Python) against their
#     committed logs, including the report-size swap-collision runs.
# Triggered on every PR and every push to main, weekly and by hand, but the heavy
# jobs only run when needed: the path sets live in ONE place, the `changes` job
# (dorny/paths-filter), which gates each heavy job on its own set. There is no
# `on: paths:` copy of them (Actions has no YAML anchors, and `on:` path filters are
# per workflow, not per job), so a PR that touches neither set costs one short
# `changes` job and the skipped jobs. Schedule and workflow_dispatch run all of them.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which heavy job this PR / push needs (both on schedule and workflow_dispatch).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      doubledeal: ${{ steps.filter.outputs.doubledeal }}
      megadreifach: ${{ steps.filter.outputs.megadreifach }}
    steps:
      # Only PR / push events are filtered; on schedule and workflow_dispatch the
      # filter is skipped (empty outputs) and all heavy jobs run via their `if:`.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request' || github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          filters: |
            doubledeal:
              - "proofs/doubledeal/security/**"      # incl. checks/scan_sorry.py
              - "proofs/doubledeal/lean/**"          # core model + Generated/ (emitted Lean)
              - "proofs/doubledeal/check_axioms.py"  # the shared axiom gate
              - "proofs/audit/**"                    # the shared #audit_all package
              - "primitives/cipher/doubledeal/**"    # the sudo spec Generated/ is emitted from
              - ".github/workflows/proofs-heavy.yml"
              - ".github/actions/lean-security/**"
            megadreifach:
              - "proofs/megadreifach/**"             # model, Generated/, MegaDreifachHeavy/
              - "primitives/hash/megadreifach/**"    # the sudo spec its Generated/ is emitted from
              - "proofs/doubledeal/check_axioms.py"  # the shared axiom gate
              - "proofs/audit/**"                    # the shared #audit_all package
              - "proofs/doubledeal/security/checks/scan_sorry.py"  # the shared sorry gate
              - ".github/workflows/proofs-heavy.yml"

  doubledeal-security-heavy:
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.doubledeal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: No admit / native_decide / sorryAx / axiom; sorry only in the allowlisted conjecture
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py
      - uses: ./.github/actions/lean-security
        with:
          build-args: "DoubleDealSecurityHeavy AuditAll"
      - name: Axiom audit of every DoubleDealSecurityHeavy theorem (registry must match the source)
        working-directory: proofs/doubledeal/security
        run: python3 ../check_axioms.py security-heavy

  megadreifach-attack-logs:
    # Python only (no Lean): the MegaDreifach attack scripts against their committed
    # logs (proofs/megadreifach/security/logs/), so the numbers in security/REPORT.md
    # are reproducible and a mismatch fails. Same path gate as megadreifach-heavy.
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.megadreifach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Attack scripts match their logs (md.py KATs, F1, F2, local probes, edge-group and toy attacks; ~2.5 min)
        run: python3 proofs/megadreifach/security/logs.py --check
      - name: Swap-collision report-size runs match logs/suit_blind_collision_full.log (all cores; ~20 CPU-min)
        run: python3 proofs/megadreifach/security/suit_blind_collision.py --check --full

  megadreifach-heavy:
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.megadreifach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate; includes MegaDreifachHeavy/)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/megadreifach/lean --exclude Generated
      # lean-action only installs elan here: no build (it runs below) and no GitHub cache.
      # With `build: false` the action would save the just-restored cache before the build
      # (and win the save race for this commit's key); the job builds from scratch anyway.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean
          build: "false"
          use-github-cache: "false"
      # No stale output of anything KatSpecCheck loads may survive into the build: an
      # imported `[init]` hook that exits 0 while Kat.lean is compiled would otherwise let
      # `lake build` report success and keep a stale Kat.olean. With the outputs deleted,
      # such a build leaves no .olean and fails. Only this package's own outputs
      # (MegaDreifach*) live in .lake/build. The path dependencies build in their own
      # directories, Generated/.lake/build (the Generated `sudo` package: Megadreifach,
      # SudoRt) and ../../audit/.lake/build, which are outside the lean-action cache path
      # and so always fresh on a CI checkout. With the cache off this step is a no-op on a
      # clean checkout; it stays as a guard.
      - name: Delete stale build outputs of the MegaDreifach package (KatSpecCheck's whole import closure)
        working-directory: proofs/megadreifach/lean
        run: |
          rm -rf .lake/build/lib/MegaDreifach* .lake/build/ir/MegaDreifach* \
                 ../../audit/.lake/build
      # Both roots: KatSpecCheck imports MegaDreifach (the default lib root) as well.
      - name: Build MegaDreifach and MegaDreifachHeavy (the 8 KAT kernel witnesses)
        working-directory: proofs/megadreifach/lean
        run: |
          lake build MegaDreifach MegaDreifachHeavy
          test -f .lake/build/lib/MegaDreifach.olean
          test -f .lake/build/lib/MegaDreifachHeavy/Kat.olean
      - name: KatSpecCheck (no [init] / [builtin_init] in the package; KAT statements are exactly v_Hash (embed (hexBytes vec.msgHex)) = .ok (embed (hexBytes vec.digestHex)))
        working-directory: proofs/megadreifach/lean
        run: lake env lean --run KatSpecCheck.lean
      - name: Axiom audit of every MegaDreifachHeavy theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py megadreifach-heavy
