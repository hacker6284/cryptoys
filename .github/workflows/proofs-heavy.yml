name: proofs-heavy

# Heavy kernel witnesses of the DoubleDeal security package (lean_lib
# DoubleDealSecurityHeavy, not a default build target, so the normal
# doubledeal-security job in proofs.yml stays fast). Runs on PRs that touch what
# those proofs depend on, on pushes to main that touch them, weekly and by hand.
on:
  pull_request:
    paths:
      - "proofs/doubledeal/security/**"
      - "proofs/doubledeal/lean/**"          # core model + Generated/ (emitted Lean)
      - "proofs/doubledeal/check_axioms.py"
      - "primitives/cipher/doubledeal/**"    # the sudo spec Generated/ is emitted from
      - ".github/workflows/proofs-heavy.yml"
  push:
    branches: [main]
    paths:
      - "proofs/doubledeal/security/**"
      - "proofs/doubledeal/lean/**"          # core model + Generated/ (emitted Lean)
      - "proofs/doubledeal/check_axioms.py"
      - "primitives/cipher/doubledeal/**"    # the sudo spec Generated/ is emitted from
      - ".github/workflows/proofs-heavy.yml"
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doubledeal-security-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: No admit / native_decide / sorryAx / axiom; sorry only in the allowlisted conjecture
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py
      # Same key as the doubledeal-security job, so the two jobs share one entry.
      - uses: actions/cache@v5
        with:
          path: proofs/doubledeal/security/.lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/doubledeal/security/lake-manifest.json', 'proofs/doubledeal/security/lean-toolchain') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/security
          use-github-cache: false
          use-mathlib-cache: true  # lake exe cache get: prebuilt Mathlib; never build it from source
          build-args: "DoubleDealSecurityHeavy DoubleDealSecurity.Audit"
      - name: Axiom audit of every DoubleDealSecurityHeavy theorem (registry must match the source)
        working-directory: proofs/doubledeal/security
        run: python3 ../check_axioms.py security-heavy
