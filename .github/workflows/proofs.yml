name: proofs

on:
  push:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "tools/emit_lean.py"
      - ".github/workflows/proofs.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "tools/emit_lean.py"
      - ".github/workflows/proofs.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Anti-drift: committed Generated/ Lean must match emit from current .sudo
  # via the pinned sudocode main commit (PR #8 merge; see SUDOCODE_LEAN_PIN).
  generated-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Lean backend pin
        id: pin
        run: |
          commit="$(grep -E '^[0-9a-f]{40}$' proofs/SUDOCODE_LEAN_PIN)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          test -n "$commit"
      - uses: actions/checkout@v5
        with:
          repository: hacker6284/sudocode
          ref: ${{ steps.pin.outputs.commit }}
          path: .sudocode-lean
      - name: Lean backend present at pin
        run: |
          test -f .sudocode-lean/backends/lean/emit.py
          test "$(git -C .sudocode-lean rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sudocode-lean/sudoc
      - name: Build sudoc
        run: cargo build --release --manifest-path .sudocode-lean/sudoc/Cargo.toml
      - name: Generated Lean matches emit (--require terminates)
        env:
          SUDOCODE_DIR: ${{ github.workspace }}/.sudocode-lean
          SUDOC: ${{ github.workspace }}/.sudocode-lean/sudoc/target/release/sudoc
        run: proofs/emit_lean.sh --check
      - name: Frozen v8 vectors rebuild byte-identically from v8/doubledeal_v8.sudo
        env:
          SUDOC: ${{ github.workspace }}/.sudocode-lean/sudoc/target/release/sudoc
        run: proofs/deprecated/doubledeal-v8/vectors/regen_v8.sh --check

  doubledeal-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/doubledeal/lean/Generated
        run: ./.lake/build/bin/doubledeal_test

  megadreifach-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/megadreifach/lean/Generated
        run: ./.lake/build/bin/megadreifach_test

  scramble-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/scramble/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/scramble/lean/Generated
        run: ./.lake/build/bin/scramble_test

  cbc-hmac-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal-cbc-hmac/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/doubledeal-cbc-hmac/lean/Generated
        run: ./.lake/build/bin/doubledeal_cbc_hmac_test

  doubledeal-v8-deprecated:
    # Frozen, deprecated DoubleDeal v8: emitted TAP + vulnerability-proof witness
    # (see proofs/deprecated/doubledeal-v8/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Witness Lean data matches witness_v8.json
        run: python3 proofs/deprecated/doubledeal-v8/lean/witness_to_lean.py --check
      - name: Frozen v8 vectors (sha + Python port)
        run: python3 proofs/deprecated/doubledeal-v8/attack/check_vectors.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v8/lean/Generated
      - name: Generated v8 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v8/lean/Generated
        run: ./.lake/build/bin/doubledeal_v8_test
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v8/lean
      - name: v8 relabelling witness (compiled emitted encrypt)
        working-directory: proofs/deprecated/doubledeal-v8/lean
        run: lake exe doubledeal_v8_witness

  doubledeal-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / unlisted native_decide
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          sorry_pat = re.compile(r"\b(sorry|admit)\b")
          native_pat = re.compile(r"\bnative_decide\b")
          # Documented TCB sites only. Empty means every native_decide is a CI fail.
          allowed_native = {
              # none: GridCycle / diamondCards / unrankPerm_inj_3 are kernel decide.
          }
          bad_sorry = []
          bad_native = []
          root = Path("proofs/doubledeal/lean")
          for path in root.rglob("*.lean"):
              if "Generated" in path.parts:
                  continue
              rel = str(path)
              text = re.sub(r"/-.*?-/", "", path.read_text(), flags=re.S)
              allow = allowed_native.get(rel, set())
              for i, line in enumerate(text.splitlines(), 1):
                  code = re.sub(r"--.*", "", line)
                  if sorry_pat.search(code):
                      bad_sorry.append(f"{path}:{i}:{line}")
                  if native_pat.search(code) and i not in allow:
                      bad_native.append(f"{path}:{i}:{line}")
          if bad_sorry:
              print("shipped Lean still contains sorry/admit:", *bad_sorry, sep="\n", file=sys.stderr)
          if bad_native:
              print("unlisted native_decide (add to READMEs + allowlist, or replace):",
                    *bad_native, sep="\n", file=sys.stderr)
          if bad_sorry or bad_native:
              sys.exit(1)
          print("no sorry/admit; no unlisted native_decide")
          PY
      - name: Vectors.lean matches committed JSON
        run: python3 proofs/doubledeal/vectors/json_to_lean.py --check
      - name: JSON was generated from current doubledeal.sudo
        run: python3 proofs/doubledeal/vectors/check_source.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/lean
      - name: Known-answer vectors (compiled Lean)
        working-directory: proofs/doubledeal/lean
        run: lake exe doubledeal
      - name: Axiom audit (top theorems use only propext, Classical.choice, Quot.sound)
        working-directory: proofs/doubledeal/lean
        run: python3 ../check_axioms.py

  doubledeal-security:
    # Mathlib security package (T1 relabellings). A green run means the listed
    # theorems check, not that the cipher is secure; see its README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No admit / native_decide / sorryAx / axiom; sorry only in the allowlisted conjecture
        run: |
          python3 proofs/doubledeal/security/checks/scan_sorry.py --selftest
          python3 proofs/doubledeal/security/checks/scan_sorry.py
      - name: V8Vectors.lean matches frozen v8 JSON
        run: python3 proofs/doubledeal/security/checks/gen_v8_vectors.py --check
      - name: Python port + relabelling checks
        run: |
          python3 proofs/doubledeal/security/checks/selftest.py
          python3 proofs/doubledeal/security/checks/check_relabel.py
          python3 proofs/doubledeal/security/checks/check_covariant.py
      # One reusable cache entry for the Mathlib download (keyed on OS, arch,
      # manifest and toolchain; no SHA), instead of lean-action's per-SHA .lake cache.
      - uses: actions/cache@v5
        with:
          path: proofs/doubledeal/security/.lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/doubledeal/security/lake-manifest.json', 'proofs/doubledeal/security/lean-toolchain') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/security
          use-github-cache: false
          use-mathlib-cache: true  # lake exe cache get: prebuilt Mathlib; never build it from source
      # The heavy library DoubleDealSecurityHeavy is not built here; it is built and
      # audited by proofs-heavy.yml. This audit still fails if its HEAVY_THEOREMS
      # registry and the heavy sources disagree.
      - name: Axiom audit of every DoubleDealSecurity theorem (KNOWN_SORRY allowlist by name; heavy library audited separately)
        working-directory: proofs/doubledeal/security
        run: python3 ../check_axioms.py security

  megadreifach-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / unlisted native_decide
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          sorry_pat = re.compile(r"\b(sorry|admit)\b")
          native_pat = re.compile(r"\bnative_decide\b")
          # Documented TCB sites only. Empty means every native_decide is a CI fail.
          allowed_native = {
              # none: closed numerals use kernel decide (2^224 < 52!, |G| < 256^29, IV lists).
          }
          bad_sorry = []
          bad_native = []
          root = Path("proofs/megadreifach/lean")
          for path in root.rglob("*.lean"):
              if "Generated" in path.parts:
                  continue
              rel = str(path)
              text = re.sub(r"/-.*?-/", "", path.read_text(), flags=re.S)
              allow = allowed_native.get(rel, set())
              for i, line in enumerate(text.splitlines(), 1):
                  code = re.sub(r"--.*", "", line)
                  if sorry_pat.search(code):
                      bad_sorry.append(f"{path}:{i}:{line}")
                  if native_pat.search(code) and i not in allow:
                      bad_native.append(f"{path}:{i}:{line}")
          if bad_sorry:
              print("shipped Lean still contains sorry/admit:", *bad_sorry, sep="\n", file=sys.stderr)
          if bad_native:
              print("unlisted native_decide (add to READMEs + allowlist, or replace):",
                    *bad_native, sep="\n", file=sys.stderr)
          if bad_sorry or bad_native:
              sys.exit(1)
          print("no sorry/admit; no unlisted native_decide")
          PY
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean
      - name: Known-answer metadata (compiled Lean)
        working-directory: proofs/megadreifach/lean
        run: lake exe megadreifach
