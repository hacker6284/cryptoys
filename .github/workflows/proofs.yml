name: proofs

on:
  push:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "tools/emit_lean.py"
      - "tools/gencheck.py"
      - ".github/workflows/proofs.yml"
      - ".github/actions/lean-security/**"
  pull_request:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "tools/emit_lean.py"
      - "tools/gencheck.py"
      - ".github/workflows/proofs.yml"
      - ".github/actions/lean-security/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Anti-drift: committed Generated/ Lean must match emit from current .sudo
  # via the pinned sudocode main commit (PR #8 merge; see proofs/SUDOCODE_PIN).
  generated-fresh:
    runs-on: ubuntu-latest
    env:
      SUDOCODE_DIR: ${{ github.workspace }}/.sudocode-lean
      SUDOC: ${{ github.workspace }}/.sudocode-lean/sudoc/target/release/sudoc
    steps:
      - uses: actions/checkout@v5
      - name: Read the sudocode pin
        id: pin
        run: |
          commit="$(grep -E '^[0-9a-f]{40}$' proofs/SUDOCODE_PIN)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          test -n "$commit"
      - uses: actions/checkout@v5
        with:
          repository: hacker6284/sudocode
          ref: ${{ steps.pin.outputs.commit }}
          path: .sudocode-lean
      - name: Lean backend present at pin
        run: |
          test -f .sudocode-lean/backends/lean/emit.py
          test "$(git -C .sudocode-lean rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sudocode-lean/sudoc
      - name: Build sudoc
        run: cargo build --release --manifest-path .sudocode-lean/sudoc/Cargo.toml
      - name: Generated Lean matches emit (--require terminates)
        run: proofs/emit_lean.sh --check
      - name: Current vectors (JSON + Vectors.lean) rebuild byte-identically from doubledeal.sudo
        run: proofs/doubledeal/vectors/regen.sh current --check
      - name: Frozen v8 vectors rebuild byte-identically from v8/doubledeal_v8.sudo
        run: proofs/doubledeal/vectors/regen.sh v8 --check
      - name: Frozen v9 vectors rebuild byte-identically from v9/doubledeal_v9.sudo
        run: proofs/doubledeal/vectors/regen.sh v9 --check
      - name: Frozen v10 vectors rebuild byte-identically from v10/doubledeal_v10.sudo
        run: proofs/doubledeal/vectors/regen.sh v10 --check

  generated:
    # Emitted Lean of each primitive builds and its sudo tests pass (TAP).
    name: ${{ matrix.name }}-generated
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: doubledeal, dir: proofs/doubledeal/lean/Generated, test: doubledeal_test }
          - { name: megadreifach, dir: proofs/megadreifach/lean/Generated, test: megadreifach_test }
          - { name: scramble, dir: proofs/scramble/lean/Generated, test: scramble_test }
          - { name: cbc-hmac, dir: proofs/doubledeal-cbc-hmac/lean/Generated, test: doubledeal_cbc_hmac_test }
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.dir }}
      - name: Generated TAP (sudo tests)
        working-directory: ${{ matrix.dir }}
        run: ./.lake/build/bin/${{ matrix.test }}

  doubledeal-v8-deprecated:
    # Frozen, deprecated DoubleDeal v8: emitted TAP + vulnerability-proof witness
    # (see proofs/deprecated/doubledeal-v8/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No native_decide / sorry / admit / initialize in the v8 witness package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-v8/lean --exclude Generated
      - name: Witness Lean data matches witness_v8.json
        run: python3 proofs/deprecated/doubledeal-v8/lean/witness_to_lean.py --check
      - name: Frozen v8 vectors (sha + Python port)
        run: python3 proofs/deprecated/doubledeal-v8/attack/check_vectors.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v8/lean/Generated
      - name: Generated v8 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v8/lean/Generated
        run: ./.lake/build/bin/doubledeal_v8_test
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v8/lean
      - name: v8 relabelling witness (compiled emitted encrypt)
        working-directory: proofs/deprecated/doubledeal-v8/lean
        run: lake exe doubledeal_v8_witness

  doubledeal-v9-deprecated:
    # Frozen, deprecated DoubleDeal v9 (superseded by v10): emitted TAP,
    # witness data and vectors. The ~9 min kernel witness build and its axiom
    # audit run in proofs-v9-deprecated.yml
    # (see proofs/deprecated/doubledeal-v9/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No native_decide / sorry / admit / initialize in the v9 witness package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-v9/lean --exclude Generated
      - name: Witness Lean data matches witness_v9.json
        run: python3 proofs/deprecated/doubledeal-v9/lean/witness_to_lean.py --check
      - name: Frozen v9 vectors (sha + Python port) and recorded witnesses
        run: |
          python3 proofs/deprecated/doubledeal-v9/attack/check_vectors.py
          python3 proofs/deprecated/doubledeal-v9/attack/check_witnesses.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v9/lean/Generated
      - name: Generated v9 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v9/lean/Generated
        run: ./.lake/build/bin/doubledeal_v9_test

  doubledeal-v10-deprecated:
    # Frozen, deprecated DoubleDeal v10 (GridCycle per-layer parity shortfall):
    # emitted TAP, the single-deck K♣↔K♦ kernel witness on the emitted v10
    # mix_columns (cheap, ~30 s) and its axiom audit
    # (see proofs/deprecated/doubledeal-v10/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No native_decide / sorry / admit / initialize in the v10 witness package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-v10/lean --exclude Generated
      - name: Witness JSON matches the Python port; Lean data matches witness_v10.json
        run: |
          python3 proofs/deprecated/doubledeal-v10/attack/make_witness.py --check
          python3 proofs/deprecated/doubledeal-v10/lean/witness_to_lean.py --check
      - name: C measurement model agrees with the Python port (v10 GridCycle)
        run: python3 proofs/doubledeal/analysis/v10-gridcycle/xcheck.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v10/lean/Generated
      - name: Generated v10 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v10/lean/Generated
        run: ./.lake/build/bin/doubledeal_v10_test
      - name: Build the witness package
        working-directory: proofs/deprecated/doubledeal-v10/lean
        run: lake build
      - name: Axiom audit (no sorryAx / ofReduceBool)
        run: python3 proofs/doubledeal/check_axioms.py v10-deprecated

  doubledeal-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/doubledeal/lean --exclude Generated
      - name: Vectors.lean matches committed JSON
        run: python3 proofs/doubledeal/vectors/json_to_lean.py --check
      - name: JSON was generated from current doubledeal.sudo
        run: python3 proofs/doubledeal/vectors/check_source.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/lean
      - name: Known-answer vectors (compiled Lean)
        working-directory: proofs/doubledeal/lean
        run: lake exe doubledeal
      - name: Axiom audit (top theorems use only propext, Classical.choice, Quot.sound)
        working-directory: proofs/doubledeal/lean
        run: python3 ../check_axioms.py

  doubledeal-security:
    # Mathlib security package (T1 relabellings). A green run means the listed
    # theorems check, not that the cipher is secure; see its README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No admit / native_decide / sorryAx / axiom; sorry only in the allowlisted conjecture
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py
      - name: scan_sorry selftest (including --root / --exclude / --allow-sorry)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --selftest
      - name: V8Vectors.lean matches frozen v8 JSON
        run: python3 proofs/doubledeal/security/checks/gen_v8_vectors.py --check
      - name: cc and numpy for the analysis checks run by selftest.py
        run: |
          cc --version | head -1
          python3 -c "import numpy" || (sudo apt-get update -q && sudo apt-get install -y -q python3-numpy)
      - name: Python port + relabelling checks
        run: |
          python3 proofs/doubledeal/security/checks/selftest.py
          python3 proofs/doubledeal/security/checks/check_relabel.py
          python3 proofs/doubledeal/security/checks/check_covariant.py
          python3 proofs/doubledeal/security/checks/branchnum/witnesses.py > /dev/null
          git diff --exit-code proofs/doubledeal/security/checks/branchnum/witnesses.json
      - uses: ./.github/actions/lean-security
      # The heavy library DoubleDealSecurityHeavy is not built here; it is built and
      # audited by proofs-heavy.yml. This audit still fails if its HEAVY_THEOREMS
      # registry and the heavy sources disagree.
      - name: Axiom audit of every DoubleDealSecurity theorem (KNOWN_SORRY allowlist by name; heavy library audited separately)
        working-directory: proofs/doubledeal/security
        run: python3 ../check_axioms.py security
      - name: Duplicate-owner audit fires on an identical duplicate theorem (fixture)
        working-directory: proofs/doubledeal/security
        run: python3 checks/audit_dup_selftest.py

  megadreifach-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/megadreifach/lean --exclude Generated
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean
      - name: Known-answer metadata (compiled Lean)
        working-directory: proofs/megadreifach/lean
        run: lake exe megadreifach
      # The heavy library MegaDreifachHeavy (8 KAT kernel witnesses) is not built
      # here; it is built and audited by megadreifach-heavy in proofs-heavy.yml.
      - name: Axiom audit of every MegaDreifach theorem (only propext, Classical.choice, Quot.sound)
        run: python3 proofs/megadreifach/check_axioms.py
