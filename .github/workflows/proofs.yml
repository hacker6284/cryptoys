name: proofs

on:
  push:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "tools/emit_lean.py"
      - ".github/workflows/proofs.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "tools/emit_lean.py"
      - ".github/workflows/proofs.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Anti-drift: committed Generated/ Lean must match emit from current .sudo
  # via the pinned sudocode main commit (PR #8 merge; see SUDOCODE_LEAN_PIN).
  generated-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Lean backend pin
        id: pin
        run: |
          commit="$(grep -E '^[0-9a-f]{40}$' proofs/SUDOCODE_LEAN_PIN)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          test -n "$commit"
      - uses: actions/checkout@v5
        with:
          repository: hacker6284/sudocode
          ref: ${{ steps.pin.outputs.commit }}
          path: .sudocode-lean
      - name: Lean backend present at pin
        run: |
          test -f .sudocode-lean/backends/lean/emit.py
          test "$(git -C .sudocode-lean rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sudocode-lean/sudoc
      - name: Build sudoc
        run: cargo build --release --manifest-path .sudocode-lean/sudoc/Cargo.toml
      - name: Generated Lean matches emit (--require terminates)
        env:
          SUDOCODE_DIR: ${{ github.workspace }}/.sudocode-lean
          SUDOC: ${{ github.workspace }}/.sudocode-lean/sudoc/target/release/sudoc
        run: proofs/emit_lean.sh --check

  doubledeal-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/doubledeal/lean/Generated
        run: ./.lake/build/bin/doubledeal_test

  megadreifach-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/megadreifach/lean/Generated
        run: ./.lake/build/bin/megadreifach_test

  scramble-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/scramble/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/scramble/lean/Generated
        run: ./.lake/build/bin/scramble_test

  cbc-hmac-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal-cbc-hmac/lean/Generated
      - name: Generated TAP (sudo tests)
        working-directory: proofs/doubledeal-cbc-hmac/lean/Generated
        run: ./.lake/build/bin/doubledeal_cbc_hmac_test

  doubledeal-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / unlisted native_decide
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          sorry_pat = re.compile(r"\b(sorry|admit)\b")
          native_pat = re.compile(r"\bnative_decide\b")
          # Documented TCB sites only. Empty means every native_decide is a CI fail.
          allowed_native = {
              # none: GridCycle / diamondCards / unrankPerm_inj_3 are kernel decide.
          }
          bad_sorry = []
          bad_native = []
          root = Path("proofs/doubledeal/lean")
          for path in root.rglob("*.lean"):
              if "Generated" in path.parts:
                  continue
              rel = str(path)
              text = re.sub(r"/-.*?-/", "", path.read_text(), flags=re.S)
              allow = allowed_native.get(rel, set())
              for i, line in enumerate(text.splitlines(), 1):
                  code = re.sub(r"--.*", "", line)
                  if sorry_pat.search(code):
                      bad_sorry.append(f"{path}:{i}:{line}")
                  if native_pat.search(code) and i not in allow:
                      bad_native.append(f"{path}:{i}:{line}")
          if bad_sorry:
              print("shipped Lean still contains sorry/admit:", *bad_sorry, sep="\n", file=sys.stderr)
          if bad_native:
              print("unlisted native_decide (add to READMEs + allowlist, or replace):",
                    *bad_native, sep="\n", file=sys.stderr)
          if bad_sorry or bad_native:
              sys.exit(1)
          print("no sorry/admit; no unlisted native_decide")
          PY
      - name: Vectors.lean matches committed JSON
        run: python3 proofs/doubledeal/vectors/json_to_lean.py --check
      - name: JSON was generated from current doubledeal.sudo
        run: python3 proofs/doubledeal/vectors/check_source.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/lean
      - name: Known-answer vectors (compiled Lean)
        working-directory: proofs/doubledeal/lean
        run: lake exe doubledeal

  megadreifach-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / unlisted native_decide
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          sorry_pat = re.compile(r"\b(sorry|admit)\b")
          native_pat = re.compile(r"\bnative_decide\b")
          # Documented TCB sites only. Empty means every native_decide is a CI fail.
          allowed_native = {
              # none: closed numerals use kernel decide (2^224 < 52!, |G| < 256^29, IV lists).
          }
          bad_sorry = []
          bad_native = []
          root = Path("proofs/megadreifach/lean")
          for path in root.rglob("*.lean"):
              if "Generated" in path.parts:
                  continue
              rel = str(path)
              text = re.sub(r"/-.*?-/", "", path.read_text(), flags=re.S)
              allow = allowed_native.get(rel, set())
              for i, line in enumerate(text.splitlines(), 1):
                  code = re.sub(r"--.*", "", line)
                  if sorry_pat.search(code):
                      bad_sorry.append(f"{path}:{i}:{line}")
                  if native_pat.search(code) and i not in allow:
                      bad_native.append(f"{path}:{i}:{line}")
          if bad_sorry:
              print("shipped Lean still contains sorry/admit:", *bad_sorry, sep="\n", file=sys.stderr)
          if bad_native:
              print("unlisted native_decide (add to READMEs + allowlist, or replace):",
                    *bad_native, sep="\n", file=sys.stderr)
          if bad_sorry or bad_native:
              sys.exit(1)
          print("no sorry/admit; no unlisted native_decide")
          PY
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean
      - name: Known-answer metadata (compiled Lean)
        working-directory: proofs/megadreifach/lean
        run: lake exe megadreifach
