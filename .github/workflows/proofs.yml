name: proofs

on:
  push:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "primitives/key_exchange/**"
      - "tools/emit_lean.py"
      - "tools/gencheck.py"
      - ".github/workflows/proofs.yml"
      - ".github/actions/lean-security/**"
  pull_request:
    paths:
      - "proofs/**"
      - "primitives/cipher/doubledeal/**"
      - "primitives/hash/megadreifach/**"
      - "primitives/hash/scramble/**"
      - "primitives/aead/doubledeal-cbc-hmac/**"
      - "primitives/key_exchange/**"
      - "tools/emit_lean.py"
      - "tools/gencheck.py"
      - ".github/workflows/proofs.yml"
      - ".github/actions/lean-security/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Anti-drift: committed Generated/ Lean must match emit from current .sudo
  # via the pinned sudocode main commit (see proofs/SUDOCODE_PIN).
  generated-fresh:
    runs-on: ubuntu-latest
    env:
      SUDOCODE_DIR: ${{ github.workspace }}/.sudocode-lean
      SUDOC: ${{ github.workspace }}/.sudocode-lean/sudoc/target/release/sudoc
    steps:
      - uses: actions/checkout@v5
      - name: Read the sudocode pin
        id: pin
        run: |
          commit="$(sh proofs/sudocode_pin.sh)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hacker6284/sudocode
          ref: ${{ steps.pin.outputs.commit }}
          path: .sudocode-lean
      - name: Lean backend present at pin
        run: |
          test -f .sudocode-lean/backends/lean/emit.py
          test "$(git -C .sudocode-lean rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sudocode-lean/sudoc
      - name: Build sudoc
        run: cargo build --release --manifest-path .sudocode-lean/sudoc/Cargo.toml
      - name: Generated Lean matches emit (--require terminates)
        run: proofs/emit_lean.sh --check
      - name: Current vectors (JSON + Vectors.lean) rebuild byte-identically from doubledeal.sudo
        run: proofs/doubledeal/vectors/regen.sh current --check
      - name: Frozen v8-v11 vectors rebuild byte-identically from vN/doubledeal_vN.sudo
        run: |
          for v in v8 v9 v10 v11; do
            proofs/doubledeal/vectors/regen.sh "$v" --check
          done
      # sudoc's Python output (proofs/sudo_py.py builds it with the $SUDOC above): the loader
      # selftest, then the deprecated v8/v9/v10 vector and witness checks that run on it.
      - name: sudo_py loader (DoubleDeal v8-v12 table against the committed vectors)
        run: python3 proofs/sudo_py.py --selftest
      - name: Frozen v8/v9 vectors (sha + sudoc py; hand copies while they have callers), v9 witnesses, witness_v10.json
        run: |
          python3 proofs/deprecated/doubledeal-v8/attack/check_vectors.py
          python3 proofs/deprecated/doubledeal-v9/attack/check_vectors.py
          python3 proofs/deprecated/doubledeal-v9/attack/check_witnesses.py
          python3 proofs/deprecated/doubledeal-v10/attack/make_witness.py --check
      - name: BS vectors rebuild byte-identically from bs.sudo
        run: proofs/key_exchange/bs/vectors/regen.sh --check
      - name: BS vectors agree with pow() and the Python evidence harness
        run: python3 proofs/key_exchange/bs/vectors/check_oracle.py
      # ECBS: vectors from ecbs.sudo (about 20 s, most of it one Serious exchange), then
      # PARI/GP as the oracle. Of the evidence drivers (proofs/key_exchange/ecbs/evidence/)
      # only the quick ones run here (below): Demo exhaustive and the soundness classes take
      # tens of minutes.
      - name: ECBS vectors rebuild byte-identically from ecbs.sudo
        run: proofs/key_exchange/ecbs/vectors/regen.sh --check
      - name: ECBS vectors agree with PARI/GP
        run: |
          python3 -m venv "$RUNNER_TEMP/pari"
          "$RUNNER_TEMP/pari/bin/pip" install --quiet cypari2
          "$RUNNER_TEMP/pari/bin/python" proofs/key_exchange/ecbs/vectors/check_oracle.py
      # ECBS evidence that is quick enough for CI (a few seconds): card_sim Demo (all 64 key
      # pairs) and the calling checks at Demo and Toy, rerun on the generated code and diffed
      # byte for byte against the recorded results (the drivers print timings to stderr only).
      - name: ECBS card_sim Demo and calling Demo/Toy reproduce their recorded results
        run: |
          cd proofs/key_exchange/ecbs/evidence
          "$RUNNER_TEMP/pari/bin/python" card_sim.py Demo > "$RUNNER_TEMP/card_sim_Demo.txt"
          diff -u results/card_sim_Demo.txt "$RUNNER_TEMP/card_sim_Demo.txt"
          git diff --exit-code results/card_sim_Demo.json
          "$RUNNER_TEMP/pari/bin/python" calling_check.py Demo,Toy > "$RUNNER_TEMP/calling_Demo_Toy.txt"
          grep -E '^(Demo|Toy) ' results/calling_check.txt | diff -u - "$RUNNER_TEMP/calling_Demo_Toy.txt"
      # Scramble (marked broken): the 10 SPEC vectors, the attack messages in logs/, the
      # `hello` twin and the decoded `cube` pose through the JS this sudoc generates from
      # scramble.sudo (about 1 s). The seeded Python attack runs (REPORT S7) are not run here.
      - name: scramble_sudo_check.mjs output matches its log
        run: |
          out="$RUNNER_TEMP/scramble_sudo_check.log"
          node proofs/scramble/security/scramble_sudo_check.mjs > "$out" || { cat "$out"; exit 1; }
          diff -u proofs/scramble/security/logs/scramble_sudo_check.log "$out"

  generated:
    # Emitted Lean of each primitive builds and its sudo tests pass (TAP).
    name: ${{ matrix.name }}-generated
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: doubledeal, dir: proofs/doubledeal/lean/Generated, test: doubledeal_test }
          - { name: megadreifach, dir: proofs/megadreifach/lean/Generated, test: megadreifach_test }
          - { name: megadreifach-v3, dir: proofs/megadreifach-v3/lean/Generated, test: megadreifach_test }
          - { name: scramble, dir: proofs/scramble/lean/Generated, test: scramble_test }
          # DoubleDeal-CBC-Sandwich v2 (directory keeps its v1 name): emitted TAP only, no Link 2 yet.
          - { name: cbc-hmac, dir: proofs/doubledeal-cbc-hmac/lean/Generated, test: doubledeal_cbc_hmac_test }
          # Frozen DoubleDeal-CBC-HMAC v1, superseded by v2: emitted TAP of the frozen sudo
          # (its Link 2 package is checked by cbc-hmac-v1-lean).
          - { name: cbc-hmac-v1, dir: proofs/deprecated/doubledeal-cbc-hmac-v1/lean/Generated, test: doubledeal_cbc_hmac_test }
          - { name: bs, dir: proofs/key_exchange/bs/lean/Generated, test: bs_test }
          - { name: ecbs, dir: proofs/key_exchange/ecbs/lean/Generated, test: ecbs_test }
          # Frozen DoubleDeal v11, superseded by v12 (PassKey related-key property; not an
          # attack, so no witness package): emitted TAP only (proofs/deprecated/doubledeal-v11/).
          - { name: doubledeal-v11, dir: proofs/deprecated/doubledeal-v11/lean/Generated, test: doubledeal_v11_test }
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.dir }}
      - name: Generated TAP (sudo tests)
        working-directory: ${{ matrix.dir }}
        run: ./.lake/build/bin/${{ matrix.test }}

  doubledeal-v8-deprecated:
    # Frozen, deprecated DoubleDeal v8: emitted TAP + vulnerability-proof witness
    # (see proofs/deprecated/doubledeal-v8/README.md). Its vector check runs in generated-fresh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No native_decide / sorry / admit / initialize in the v8 witness package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-v8/lean --exclude Generated
      - name: Witness Lean data matches witness_v8.json
        run: python3 proofs/deprecated/doubledeal-v8/lean/witness_to_lean.py --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v8/lean/Generated
      - name: Generated v8 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v8/lean/Generated
        run: ./.lake/build/bin/doubledeal_v8_test
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v8/lean
      - name: v8 relabelling witness (compiled emitted encrypt)
        working-directory: proofs/deprecated/doubledeal-v8/lean
        run: lake exe doubledeal_v8_witness

  doubledeal-v9-deprecated:
    # Frozen, deprecated DoubleDeal v9 (superseded by v10): emitted TAP and
    # witness data (vectors and recorded witnesses: generated-fresh). The ~9 min
    # kernel witness build and its axiom audit run in proofs-v9-deprecated.yml
    # (see proofs/deprecated/doubledeal-v9/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No native_decide / sorry / admit / initialize in the v9 witness package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-v9/lean --exclude Generated
      - name: Witness Lean data matches witness_v9.json
        run: python3 proofs/deprecated/doubledeal-v9/lean/witness_to_lean.py --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v9/lean/Generated
      - name: Generated v9 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v9/lean/Generated
        run: ./.lake/build/bin/doubledeal_v9_test

  doubledeal-v10-deprecated:
    # Frozen, deprecated DoubleDeal v10 (GridCycle per-layer parity shortfall):
    # emitted TAP, the single-deck K♣↔K♦ kernel witness on the emitted v10
    # mix_columns (cheap, ~30 s) and its axiom audit
    # (see proofs/deprecated/doubledeal-v10/README.md). witness_v10.json --check: generated-fresh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No native_decide / sorry / admit / initialize in the v10 witness package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-v10/lean --exclude Generated
      - name: Lean data matches witness_v10.json
        run: python3 proofs/deprecated/doubledeal-v10/lean/witness_to_lean.py --check
      - name: C measurement model agrees with the Python port (v10 GridCycle)
        run: python3 proofs/doubledeal/analysis/v10-gridcycle/xcheck.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-v10/lean/Generated
      - name: Generated v10 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/doubledeal-v10/lean/Generated
        run: ./.lake/build/bin/doubledeal_v10_test
      - name: Build the witness package
        working-directory: proofs/deprecated/doubledeal-v10/lean
        run: lake build
      - name: Axiom audit (no sorryAx / ofReduceBool)
        run: python3 proofs/doubledeal/check_axioms.py v10-deprecated

  megadreifach-v1-deprecated:
    # Frozen, deprecated MegaDreifach v1 (superseded by v2): emitted v1 TAP and the
    # v1 weakness proofs (CornerDriven, FreeStart, SwapCollision) with their import
    # closure, built against the v1 emit, plus their axiom audit
    # (see proofs/deprecated/megadreifach-v1/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide / initialize in the frozen v1 package
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/megadreifach-v1/lean --exclude Generated
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/megadreifach-v1/lean/Generated
      - name: Generated v1 TAP (frozen sudo tests)
        working-directory: proofs/deprecated/megadreifach-v1/lean/Generated
        run: ./.lake/build/bin/megadreifach_test
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/megadreifach-v1/lean
      - name: Axiom audit of every MegaDreifachV1 theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py megadreifach-v1-deprecated

  doubledeal-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/doubledeal/lean --exclude Generated
      - name: Vectors.lean matches committed JSON
        run: python3 proofs/doubledeal/vectors/json_to_lean.py --check
      - name: JSON was generated from current doubledeal.sudo
        run: python3 proofs/doubledeal/vectors/check_source.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/doubledeal/lean
      - name: Known-answer vectors (compiled Lean)
        working-directory: proofs/doubledeal/lean
        run: lake exe doubledeal
      - name: Axiom audit (top theorems use only propext, Classical.choice, Quot.sound)
        working-directory: proofs/doubledeal/lean
        run: python3 ../check_axioms.py

  doubledeal-security:
    # Mathlib security package (T1 relabellings). A green run means the listed
    # theorems check, not that the cipher is secure; see its README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No admit / native_decide / sorryAx / axiom / sorry
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py
      - name: scan_sorry selftest (including --root / --exclude / --allow-sorry)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --selftest
      - name: V8Vectors.lean matches frozen v8 JSON
        run: python3 proofs/doubledeal/security/checks/gen_v8_vectors.py --check
      - name: Heavy RealKey.lean expected ciphertexts match the v12 Python port
        run: python3 proofs/doubledeal/security/checks/realkeys/realkey_to_lean.py --check
      - name: GridCycleSurvivalLists.lean (LKC / LKS) matches the v12-diffusion enumeration
        run: python3 proofs/doubledeal/analysis/v12-diffusion/prefix_survival.py --check
      - name: CovariantNarrowLists.lean / CovariantNarrowChecks.lean and cell0_witness.log match cell0_witness.py
        run: python3 proofs/doubledeal/analysis/v12-covariant/cell0_witness.py --check
      - name: cell0_sample.log matches a fresh seeded run (measurement log, ~10 s)
        run: python3 proofs/doubledeal/analysis/v12-covariant/cell0_sample.py --check
      - name: CovariantAffineLists.lean / CovariantAffineChecks.lean and aff_witness.log match aff_witness.py
        run: python3 proofs/doubledeal/analysis/v12-primenonswap/aff_witness.py --check
      - name: RankPartitionLists.lean / RankPartitionChecks.lean and rank_family.log match rank_family.py
        run: python3 proofs/doubledeal/analysis/v12-primenonswap/rank_family.py --check
      - name: V10SymLists.lean / V10SymChecks.lean and v10sym_witness.log match v10sym_witness.py
        run: python3 proofs/doubledeal/analysis/v12-primenonswap/v10sym_witness.py --check
      # numpy is imported by proofs/doubledeal/analysis/v10-sumranks/check_cand.py (directly)
      # and sbox-search/verify.py (via sb.py), which selftest.py runs. Probe with find_spec, which returns
      # None instead of raising, then require a working import (fails the step if absent).
      - name: cc and numpy for the analysis checks run by selftest.py
        run: |
          cc --version | head -1
          if python3 -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('numpy') is None)"; then
            echo "numpy already installed"
          else
            echo "numpy not installed: installing python3-numpy"
            sudo apt-get update -q && sudo apt-get install -y -q python3-numpy
          fi
          python3 -c "import numpy; print('numpy', numpy.__version__)"
      - name: Python port + relabelling checks
        run: |
          python3 proofs/doubledeal/security/checks/selftest.py
          python3 proofs/doubledeal/security/checks/check_relabel.py
          python3 proofs/doubledeal/security/checks/check_covariant.py
          python3 proofs/doubledeal/security/checks/branchnum/witnesses.py > /dev/null
          git diff --exit-code proofs/doubledeal/security/checks/branchnum/witnesses.json
      - uses: ./.github/actions/lean-security
      # The heavy library DoubleDealSecurityHeavy is not built here; it is built and
      # audited by proofs-heavy.yml. This audit still fails if its HEAVY_THEOREMS
      # registry and the heavy sources disagree.
      - name: Axiom audit of every DoubleDealSecurity theorem (no sorryAx allowed, KNOWN_SORRY empty; heavy library audited separately)
        working-directory: proofs/doubledeal/security
        run: python3 ../check_axioms.py security
      # Core Lean only (no Mathlib import; about a second): the registry's source scan must
      # agree with Lean on its fixture.
      - name: Heavy-registry source scan agrees with Lean on its fixture (check_axioms.py --selftest-lean)
        working-directory: proofs/doubledeal/security
        run: python3 ../check_axioms.py --selftest-lean
      - name: Duplicate-owner audit fires on an identical duplicate theorem (fixture)
        working-directory: proofs/doubledeal/security
        run: python3 checks/audit_dup_selftest.py
      - name: SumRanks import closure from Lean (rebuilt first; total and Mathlib counts pinned)
        working-directory: proofs/doubledeal/security
        run: |
          python3 checks/check_closure.py --selftest
          python3 checks/check_closure.py

  megadreifach-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/megadreifach/lean --exclude Generated
      - name: Vectors.lean and KatSpecCheck.lean match the published KAT JSON; Kat.lean statement lint
        run: python3 proofs/megadreifach/vectors/json_to_lean.py --check
      - name: Axiom gate keying rules (private/public collisions fail under key "full"); MD_README_THEOREMS equals the README-cited theorems
        run: python3 proofs/doubledeal/check_axioms.py --selftest
      - name: Swap-collision measurement log matches a fresh seeded run (quick; the report-size runs are in proofs-heavy.yml)
        run: python3 proofs/megadreifach/security/suit_blind_collision.py --check
      - name: v2 security evidence, quick set matches its logs (engine self-check against the 8 v2 KATs + HashDeck; cost, grip-merge and suit counts, v2e pair, pseudo-collision pairs; a few seconds; the report-size runs are in proofs-heavy.yml)
        run: python3 proofs/megadreifach/security/v2/experiments.py --check
      - name: M9 two-card window search (Python cross-check of the Lean M9 proof, not part of it; self-checks the 8 v2 KATs; asserts its counts; about 20 s in CI)
        run: python3 proofs/megadreifach/m9/m9_search.py
      - name: M9 decoder certificate M9Cert.lean matches a fresh generation (untrusted data, re-checked by the kernel; about 10 s)
        run: python3 proofs/megadreifach/m9/m9_cert.py --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach/lean
      - name: Known-answer metadata (compiled Lean)
        working-directory: proofs/megadreifach/lean
        run: lake exe megadreifach
      # KatSpecCheck.lean (generated) pins the type of every heavy kat_<name> and rejects
      # [init] hooks. Its planted negatives run on a stubbed copy of Kat.lean (no KAT
      # kernel evaluation):
      - name: KatSpecCheck catches planted shadows and [init] hooks (vec_*, hexBytes, v_Hash, macro_rules, @[init] exit 0)
        run: python3 proofs/megadreifach/vectors/katspec_negatives.py
      # The heavy library MegaDreifachHeavy (8 KAT kernel witnesses) is not built
      # here; it is built and audited by megadreifach-heavy in proofs-heavy.yml.
      - name: Axiom audit of every MegaDreifach theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py megadreifach

  megadreifach-v3-lean:
    # MegaDreifach v3 (ZP26 card phase; proofs/megadreifach-v3): the KAT data mirrored from
    # kats/megaminx_hash_kats_v3.json, a compiled run of the emitted v3 code on every vector
    # (52 checks, about a second; not a kernel proof), Link 2 for all 12 exports (the v3
    # MegaDreifachV3.Link2 files plus v2 lemmas re-elaborated against the v3 emit: 81 modules,
    # 18 v3 and 63 v2, plus Generated/; about 4 min serial locally from clean). ReadWord's
    # two-turn check is one kernel decide! per piece and colour order. Measured on that
    # package build under ulimit -v 7000000: peak RSS 710452 kB (about 0.7 GB, VmHWM),
    # peak virtual 1104064 kB (about 1.1 GB). The previous single decide! of every piece
    # exceeded about 6.1 GB RSS. Axiom audit follows.
    # The emitted TAP is megadreifach-v3-generated; emit freshness is generated-fresh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/megadreifach-v3/lean --exclude Generated
      - name: Vectors.lean matches the published v3 KAT JSON
        run: python3 proofs/megadreifach-v3/vectors/json_to_lean.py --check
      - name: check_axioms selftest (keying rules, README-cited theorems, v3 sudo exports vs README table)
        run: python3 proofs/doubledeal/check_axioms.py --selftest
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/megadreifach-v3/lean
      - name: v3 KATs against the compiled emitted code (Hash, HashDeck, HashDeckBody, IV digest)
        working-directory: proofs/megadreifach-v3/lean
        run: lake exe megadreifach_v3_kat
      - name: The v3 KAT run fails on a planted bad digest and on emptied vector lists (by its own summary lines; a crash is not accepted)
        run: |
          python3 proofs/megadreifach-v3/vectors/kat_negatives.py
          python3 proofs/megadreifach-v3/vectors/kat_negatives.py --selftest-crash
      - name: Axiom audit of every MegaDreifachV3 theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py megadreifach-v3

  cbc-hmac-v1-lean:
    # Frozen DoubleDeal-CBC-HMAC v1 Link 2 (proofs/deprecated/doubledeal-cbc-hmac-v1/lean): the
    # emitted v1 functions equal the hand-written model. v1 is superseded by
    # DoubleDeal-CBC-Sandwich v2, which has no Link 2 yet. Rebuilds the MegaDreifach Link 2 sources it uses
    # (v_Hash_refines) against this package's own emitted Megadreifach module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/deprecated/doubledeal-cbc-hmac-v1/lean --exclude Generated
      - name: check_axioms selftest (keying rules, README-cited theorems, sudo exports vs README table)
        run: python3 proofs/doubledeal/check_axioms.py --selftest
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/deprecated/doubledeal-cbc-hmac-v1/lean
      - name: Axiom audit of every DoubleDealCbcHmac (frozen v1) theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py cbc-hmac-v1-deprecated

  scramble-lean:
    # Scramble Link 2 (proofs/scramble/lean): the hand-written v2 and v1 models, their SPEC
    # vectors (kernel decide!, a few seconds), the reachability invariant, and the
    # refinement of the emitted code: the v2 digest path (digest-only and traced, several
    # updates) and the v1 digest-only path. Rebuilds the MegaDreifach Link 2 runtime
    # lemmas it uses (Embed, Sudo, Loop) against this package's own emitted SudoRt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/scramble/lean --exclude Generated
      - name: Axiom gate keying rules; SCRAMBLE_LINK2 equals the README-cited theorems
        run: python3 proofs/doubledeal/check_axioms.py --selftest
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/scramble/lean
      - name: Axiom audit of every ScrambleV2 theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py scramble

  bs-lean:
    # BS Link 2 (proofs/key_exchange/bs/lean): the hand-written model of SPEC §2.3, §3,
    # §3.1 and B3 to B9, and the refinement of the emitted tier, multiply, tidy,
    # check_received, send_public_value, public_value, shared_secret and exchange (the last
    # three given read_key's output). Short: the build is about a minute, no heavy checks.
    # Rebuilds the MegaDreifach Link 2 runtime lemmas it uses (Embed, Sudo, Loop) against
    # this package's own emitted SudoRt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/key_exchange/bs/lean --exclude Generated
      - name: Axiom gate keying rules; BS_LINK2 equals the README-cited theorems; export table
        run: python3 proofs/doubledeal/check_axioms.py --selftest
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/key_exchange/bs/lean
      - name: Axiom audit of every BsLink2 theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py bs

  ecbs-lean:
    # ECBS Link 2 (proofs/key_exchange/ecbs/lean): tier, coordinate, band, place (the
    # record update), keypad for faces 1..9, list helpers, the lane-fold geometry
    # as Nat arithmetic, the schoolbook loop inside mul (one generic column
    # loop and the descending outer loop), and the descending lane_fold loop
    # (one stepper, reused by both max_bench_hole branches) and the export-path
    # product `mulPipeline_spec` (fresh bench, schoolbook, that fold, `Spec.fieldMul`).
    # `lane_fold_eq` is emitted `Ecbs.lane_fold`. `mul_refines` is `Ecbs.mul` on
    # the export flags. `cube_refines` is emitted `Ecbs.cube` (comb, then that
    # fold) against `Spec.fieldCube`. `folded_read` is settle then value.
    # `new_board_refines` is emitted `Ecbs.new_board` on `BoardOk`, tied to
    # `Spec.rungList` (control row in build order, ladder array reversed).
    # Park, the tally steps, doubling, the white-peg check, tally_clear, and
    # the settle/ops-bump frame are tied. cube and nocopy mul with the bench
    # already on (aimed at the home about to be read, zero tail) slide first
    # and then match the bench-off lemmas; the prefix is fieldCube / fieldMul
    # of that length-n prefix. tally0 and control_highest survive both calls,
    # and cube empties only the source home. A bench-off cube returns a named board;
    # a live cube returns that board of the slid state. One cube then a red tally peg
    # and ctrl+1 is tied for both, by rewriting those projections. Nocopy mul, bench
    # off or live, likewise returns a named board. One model rung keeps the
    # gap and the tally length equal to `invRung`, and records the park swap,
    # the tally colours, and the control-counter sum the emitted rung leaves.
    # The white-peg scan leaves the board unchanged.
    # One live cube then a red peg is a named board. The cube-then-red-peg loop
    # is tied (first peg bench-off, later pegs the named live cube; the prefix
    # is cubeTimes). A final white rung with nothing parked is that loop, the
    # named live nocopy mul, and clear, and the climb invariant holds for one
    # model step on that board. A non-final rung doubles. A red rung cubes
    # and multiplies, and lays one more peg when it is not final. A later
    # rung unparks before it parks. One charge covers the heaviest rung.
    # Moves, slides, peak, and ops are bounded by that charge, not pinned.
    # and invert_number are not theorems yet. fold and the exchange are not
    # claimed yet. Short: no heavy checks.
    # Rebuilds the MegaDreifach Link 2 runtime lemmas it uses (Embed, Sudo, Loop) against
    # this package's own emitted SudoRt.
    # Measured on a clean `lake build EcbsLink2` under ulimit -v 7000000: peak RSS
    # 607620 kB (about 0.58 GB). The job builds `place`, the schoolbook loop
    # (`schoolCol_refines`, `school_loop_refines`), the lane-fold index block
    # (`foldGeom_refines`), the descending accumulation
    # (`fold_loop_refines`, `lane_fold_refines`, `lane_fold_eq`), `mulSchool_step`,
    # `mulPipeline_spec`, `mul_refines`, `copy_band_refines`, `comb_loop_refines`,
    # `cube_refines`, `folded_read`, `value_after_set`, `settle_refines`, and
    # `new_board_refines`, `multiply_refines`, and `cube_number_refines`,
    # plus park / unpark, the one-peg tally steps, and emitted doubling.
    # The climb induction carries the per-rung charge. The geometric tally cap
    # does not fit the control row on Demo, Toy, Hobby, or Serious; the domain
    # cap is the row room, and the concrete climb fits it. The R-charge i64
    # checks hold at both caps. A later rung copies off the bench and slides
    # that bench into the gap before the peg loop. The per-rung obligation,
    # the ladder for, invert_number, fold, and the exchange are not tied yet.
    # The live tally peg after a named live cube is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No sorry / admit / native_decide (shared gate)
        run: python3 proofs/doubledeal/security/checks/scan_sorry.py --root proofs/key_exchange/ecbs/lean --exclude Generated
      - name: Axiom gate keying rules; ECBS_LINK2 equals the README-cited theorems; export table
        run: python3 proofs/doubledeal/check_axioms.py --selftest
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/key_exchange/ecbs/lean
      - name: Axiom audit of every EcbsLink2 theorem (only propext, Classical.choice, Quot.sound; shared gate)
        run: python3 proofs/doubledeal/check_axioms.py ecbs
