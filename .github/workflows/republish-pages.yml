# Deploy the gh-pages tree (production root + pr/<N>/ previews) through
# the official Pages artifact. pages.yml calls this after publish-branch;
# a successful preview run and workflow_dispatch run it directly. Every
# path checks out gh-pages when the deploy job starts.
#
# github-pages allows only main. workflow_call uses the caller's
# GITHUB_REF (pages pushes main). workflow_run uses the default branch.

name: republish-pages

on:
  workflow_call:
  workflow_run:
    workflows: [preview]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # workflow_call reuses the caller's event, so a pages push is `push`,
    # not `workflow_call`. Skip only a preview workflow_run that failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      # Job-level: a called workflow joins this group here, and a direct
      # run does too. The caller job must not use group `pages` — with
      # cancel-in-progress that cancels the caller when this job starts.
      # Every deploy checks out current gh-pages HEAD, so cancelling the
      # running holder (stuck queue, #192) or replacing the one pending
      # deploy still publishes the newest tree.
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Require a production root
        run: |
          test -f index.html
          test -f .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
