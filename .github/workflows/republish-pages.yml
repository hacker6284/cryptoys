# Deploy the gh-pages tree (production root + pr/<N>/ previews) through
# the official Pages artifact. Runs on main so it satisfies the
# github-pages environment branch policy.
#
# Triggered after the preview workflow writes or removes a PR folder.

name: republish-pages

on:
  workflow_run:
    workflows: [preview]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Require a production root
        run: |
          test -f index.html
          test -f .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
