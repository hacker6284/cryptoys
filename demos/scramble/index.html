<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scramble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/grow-field.css">
  <link rel="stylesheet" href="../shared/step.css">
  <link rel="stylesheet" href="./style.css">
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("standalone") === "1") return;
      var dest = new URL("../", location.href);
      dest.searchParams.set("algo", "scramble");
      location.replace(dest.pathname + dest.search);
    })();
  </script>
  <script src="./vendor/cube.js"></script>
  <script src="./vendor/solve.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-chrome">
    <nav class="site-nav" aria-label="Site">
      <a class="site-brand" href="../">cryptoys</a>
      <span class="site-sep" aria-hidden="true">/</span>
      <span class="site-current">Scramble</span>
    </nav>
    <button id="spec-btn" class="chrome-action" type="button">Spec</button>
  </header>
  <div class="shell">
    <section class="stage">
      <header class="stage-head">
        <p class="eyebrow"><span id="gen-label">Gen 2</span> · toy digest · 65.2 bits</p>
        <h1>Scramble</h1>
      </header>
      <canvas></canvas>
      <div class="teach" id="teach" hidden>
        <div id="tape" class="tape" aria-label="Message tape"></div>
        <article class="teach-card" id="teach-card"></article>
        <div class="transport" id="transport">
          <button type="button" data-jump="round-back" title="Previous symbol">«</button>
          <button type="button" data-jump="stage-back" title="Previous stage">‹</button>
          <button type="button" data-jump="back">Back</button>
          <span class="pos" id="teach-pos">—</span>
          <button type="button" data-jump="fwd">Forward</button>
          <button type="button" data-jump="stage-fwd" title="Next stage">›</button>
          <button type="button" data-jump="round-fwd" title="Next symbol">»</button>
        </div>
      </div>
    </section>
    <aside class="panel">
      <div class="row">
        <button id="play" class="primary" type="button">Play</button>
        <button id="step-through" type="button">Step through</button>
        <button id="step" type="button">Step</button>
        <button id="reset" type="button">Reset</button>
        <button id="digest-btn" type="button">Digest</button>
        <button id="solve" type="button">Solve</button>
      </div>
      <label class="slider">Speed <input id="speed" type="range" min="0.5" max="4" step="0.1" value="1.4"></label>
      <p id="status" class="status">Solved start · white up, green front, red right</p>
      <p id="digest" class="digest"></p>
      <p id="error" class="error"></p>
      <div class="row">
        <button type="button" data-version="1">Gen 1</button>
        <button type="button" class="on" data-version="2">Gen 2</button>
        <button type="button" class="on" data-encoding="text">text</button>
        <button type="button" data-encoding="hex">hex</button>
      </div>
      <textarea id="message" class="grow-field" rows="1" spellcheck="false" placeholder="hello"></textarea>
      <p id="io-note" class="io-note" hidden></p>
      <div id="outline" class="outline" hidden></div>
      <p class="fine">A message scrambles a solved cube. The seated pose is the digest.</p>
    </aside>
  </div>
  <dialog id="spec">
    <div class="spec-bar">
      <strong>Specification</strong>
      <button id="spec-close" type="button">Close</button>
    </div>
    <article id="spec-body"></article>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
