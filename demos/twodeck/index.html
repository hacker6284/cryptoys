<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TwoDeck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-chrome">
    <nav class="site-nav" aria-label="Site">
      <a class="site-brand" href="../">cryptoys</a>
      <span class="site-sep" aria-hidden="true">/</span>
      <span class="site-current">TwoDeck</span>
    </nav>
  </header>
  <div class="shell">
    <section class="stage">
      <header class="stage-head">
        <p class="eyebrow">toy block cipher · 52 cards</p>
        <h1>TwoDeck</h1>
      </header>
      <canvas></canvas>
      <p id="caption" class="caption">Plaintext on the left. Key on the right.</p>
    </section>
    <aside class="panel">
      <p class="note">A block is one deck. How text becomes cards is <button type="button" class="inline-link" data-open-spec>§5.3 of the Spec</button>, outside encrypt and decrypt.</p>
      <div class="row">
        <button type="button" data-mode="ecb" class="on">ECB</button>
        <button type="button" data-mode="ctr">CTR</button>
        <button type="button" data-direction="encrypt" class="on">Encrypt</button>
        <button type="button" data-direction="decrypt">Decrypt</button>
        <button id="spec-btn" type="button" data-open-spec>Spec</button>
      </div>
      <label class="field"><span id="input-label">Plaintext</span>
        <textarea id="message" rows="4" spellcheck="false">hello</textarea>
      </label>
      <label class="field">Key
        <textarea id="key" rows="2" spellcheck="false">cryptoy</textarea>
      </label>
      <div class="row">
        <button id="random-key" type="button">Random key</button>
      </div>
      <div id="nonce-field" hidden>
        <label class="field">Nonce
          <textarea id="nonce" rows="2" spellcheck="false">nonce</textarea>
        </label>
        <div class="row">
          <button id="random-nonce" type="button">Random nonce</button>
        </div>
      </div>
      <label class="field"><span id="output-label">Ciphertext</span>
        <textarea id="output" rows="5" spellcheck="false" readonly></textarea>
      </label>
      <div class="row">
        <button id="start" class="primary" type="button">Start</button>
        <button id="step" type="button">Step</button>
        <button id="stop" type="button">Stop</button>
      </div>
      <label class="slider">Speed <input id="speed" type="range" min="0.6" max="24" step="0.1" value="1.8"></label>
      <div class="row">
        <button id="copy" type="button">Copy ciphertext</button>
      </div>
      <p id="error" class="error"></p>
    </aside>
  </div>
  <dialog id="spec">
    <div class="spec-bar">
      <strong>Specification</strong>
      <button id="spec-close" type="button">Close</button>
    </div>
    <article id="spec-body"></article>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
