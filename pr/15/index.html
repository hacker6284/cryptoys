<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cryptoys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared/tokens.css">
  <link rel="stylesheet" href="./shared/base.css">
  <link rel="stylesheet" href="./playroom/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="playroom">
  <div class="playroom-app">
    <header class="playroom-chrome">
      <div class="playroom-chrome-start">
        <h1 class="playroom-title" id="title">cryptoys</h1>
        <div class="playroom-pose" id="pose-ui">
          <button type="button" class="chrome-action" id="sit" hidden>Sit at the table</button>
          <button type="button" class="chrome-action" id="back" hidden>Back</button>
        </div>
      </div>
      <nav class="playroom-menu" id="menu" aria-label="Algorithms">
        <p class="playroom-menu-label">algorithms</p>
        <a href="./doubledeal/" data-algo="doubledeal">DoubleDeal</a>
        <button type="button" class="playroom-algo" data-algo="scramble">Scramble</button>
      </nav>
    </header>
    <div class="playroom-body">
      <section class="playroom-stage" aria-label="Playroom window">
        <div class="playroom-window">
          <canvas id="playroom" aria-label="Evening playroom"></canvas>
        </div>
      </section>
      <aside class="playroom-panel" id="playroom-panel" hidden></aside>
    </div>
    <p id="load-error" class="error" hidden></p>
  </div>
  <noscript>
    <p class="playroom-noscript">The playroom needs JavaScript. The teaching demos are still at <a href="./doubledeal/">DoubleDeal</a> and <a href="./scramble/">Scramble</a>.</p>
  </noscript>
  <script type="module" src="./playroom/app.js"></script>
</body>
</html>
