<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cubing.js spike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.cubing.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../playroom/style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "cubing/twisty": "https://cdn.cubing.net/v0/js/cubing/twisty"
      }
    }
  </script>
</head>
<body class="playroom cubing-spike">
  <canvas id="playroom" aria-label="Playroom with cubing.js spike puzzle"></canvas>
  <h1 class="playroom-title" id="title">cubing.js spike</h1>
  <p class="spike-banner">SPIKE · cubing.js in the playroom · production Scramble is unchanged</p>
  <nav class="playroom-menu on" id="menu" aria-label="Spike">
    <p class="playroom-menu-label">spike</p>
    <a href="../">Playroom</a>
    <a href="../?algo=scramble">Scramble (prod)</a>
    <a href="./NOTES.md">Notes</a>
  </nav>
  <div class="spike-dock" id="spike-dock">
    <div class="playroom-card spike-card">
      <div class="playroom-seg" role="group" aria-label="Puzzle">
        <button type="button" class="seg-btn on" data-puzzle="3x3x3">3×3</button>
        <button type="button" class="seg-btn" data-puzzle="megaminx">Megaminx</button>
        <button type="button" class="seg-btn" data-puzzle="pyraminx">Pyraminx</button>
      </div>
      <div class="row spike-actions">
        <button id="play" class="icon-btn icon-primary" type="button">Play</button>
        <button id="pause" class="icon-btn" type="button">Pause</button>
        <button id="step" class="icon-btn" type="button">Step</button>
        <button id="reset" class="icon-btn" type="button">Reset</button>
        <button id="lift" class="icon-btn" type="button">Lift</button>
        <button id="seat" class="icon-btn" type="button">Shelf</button>
      </div>
      <label class="spike-alg" for="alg">
        <span class="playroom-label">Alg</span>
        <input id="alg" type="text" spellcheck="false" autocomplete="off">
      </label>
      <p id="spike-status" class="status playroom-status">Loading cubing.js…</p>
      <div id="spike-notes" class="spike-notes"></div>
    </div>
  </div>
  <p id="load-error" class="error" hidden></p>
  <noscript>
    <p class="playroom-noscript">This spike needs JavaScript. Production Scramble still works from the playroom.</p>
  </noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
