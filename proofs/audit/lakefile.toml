name = "audit"
version = "0.1.0"
defaultTargets = ["AuditAll", "UnfoldMatchers"]

# `#audit_all` (AuditAll.lean). Core Lean only: no Mathlib, no other dependency,
# so both the Mathlib security package and the dependency-free MegaDreifach
# package can require it by path. The gate is proofs/doubledeal/check_axioms.py.
[[lean_lib]]
name = "AuditAll"

# `unfold_matchers` (UnfoldMatchers.lean): a proof tactic, core Lean only, version-neutral
# home for MegaDreifach v2 / v3 (PadRef). No theorems.
[[lean_lib]]
name = "UnfoldMatchers"
