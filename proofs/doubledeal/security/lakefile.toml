name = "DoubleDealSecurity"
version = "0.1.0"
defaultTargets = ["DoubleDealSecurity"]

# Security theorems (T1+). The refinement package (../lean) and its Generated/
# dependency stay dependency-free; they are only imported here.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.14.0"

[[require]]
name = "DoubleDeal"
path = "../lean"

[[lean_lib]]
name = "DoubleDealSecurity"

# Heavy kernel witnesses (minutes of `decide!`). Not a default target: built and
# audited by the separate `doubledeal-security-heavy` job (proofs-heavy.yml).
[[lean_lib]]
name = "DoubleDealSecurityHeavy"

# Work in progress (NOT a default target, NOT built by CI): the counting proof
# that non-symmetry relabellings survive v10 SumRanks on at most 52!/64 decks.
# Sources live outside this package directory (../security-wip) so that
# checks/scan_sorry.py and Audit.lean are unaffected. Build explicitly with
# `lake build DoubleDealSecurityWIP`.
[[lean_lib]]
name = "DoubleDealSecurityWIP"
srcDir = "../security-wip"
