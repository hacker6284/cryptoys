name = "MegaDreifachV3"
version = "0.1.0"
defaultTargets = ["MegaDreifachV3", "MegaDreifachLink", "megadreifach_v3_kat"]

# MegaDreifach v3 (ZP26 card phase). Path-requires the Lean emitted from
# primitives/hash/megadreifach/v3/megadreifach.sudo (do not edit Generated/). See ../README.md.
[[require]]
name = "sudo"
path = "Generated"

# `#audit_all` for Axioms.lean (gate: proofs/doubledeal/check_axioms.py megadreifach-v3).
[[require]]
name = "audit"
path = "../../audit"

[[lean_lib]]
name = "MegaDreifachV3"

# Compiled KAT runner (MegaDreifachV3/KatRun.lean): not a kernel proof.
[[lean_exe]]
name = "megadreifach_v3_kat"
root = "Main"


# v2 Link 2 layers re-elaborated against the v3 emit (this package's Generated/, module
# `Megadreifach`): the sources stay in ../../megadreifach/lean, the .olean files are built
# here. Explicit roots, not a `MegaDreifach.+` glob: the roots are exactly the modules
# (with their full import closure) that elaborate against the v3 emit. The step lemmas of
# RequirePerm, PadRef, EvenRank(Gen), PosBytes, PhiChunk and PhiInv take the .sudo assert
# line as a parameter, so they hold for both emits. EmHelpers, EmCorner and EmEdge are the
# generic face / corner / edge tables (the grip lemmas are in EmGrip). IV holds the
# v2 IV-COOK12 constant data that v3's iv_cook12 reuses. Not listed, because
# they name v2-only emitted functions: EmGrip, EmSpin, EmRecipe, EmStep, EmInv, EmBlock,
# EmIv, InjInv, VHash, VHashDeck. See ../README.md.
# MegaDreifach.Em (the v2 model, grips included) is re-elaborated because the reused layers
# take faceTurn / inverse / nbr / cornerSlot / edgeSlot from it; it states nothing about
# v3's card phase.
[[lean_lib]]
name = "MegaDreifachLink"
srcDir = "../../megadreifach/lean"
