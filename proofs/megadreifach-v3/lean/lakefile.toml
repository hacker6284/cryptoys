name = "MegaDreifachV3"
version = "0.1.0"
defaultTargets = ["MegaDreifachV3", "MegaDreifachLink", "megadreifach_v3_kat"]

# MegaDreifach v3 (ZP26 card phase). Path-requires the Lean emitted from
# primitives/hash/megadreifach/v3/megadreifach.sudo (do not edit Generated/). See ../README.md.
[[require]]
name = "sudo"
path = "Generated"

# `#audit_all` for Axioms.lean (gate: proofs/doubledeal/check_axioms.py megadreifach-v3).
[[require]]
name = "audit"
path = "../../audit"

[[lean_lib]]
name = "MegaDreifachV3"

# Compiled KAT runner (MegaDreifachV3/KatRun.lean): not a kernel proof.
[[lean_exe]]
name = "megadreifach_v3_kat"
root = "Main"


# v2 Link 2 layers re-elaborated against the v3 emit (this package's Generated/, module
# `Megadreifach`): the sources stay in ../../megadreifach/lean, the .olean files are built
# here. Explicit roots, not a `MegaDreifach.+` glob: the roots are exactly the modules
# (with their full import closure) that elaborate unchanged against the v3 emit. Not
# listed, because they do not: the v2 grip lemmas (EmHelpers, EmCorner, EmEdge, EmSpin,
# EmRecipe, EmStep, EmInv, EmBlock, EmIv, VHash, VHashDeck, InjInv) and the modules that
# hard-code v2 .sudo line numbers or v2 matcher names (EvenRank, PadRef, RequirePerm and
# their dependents PosBytes, PhiChunk, PhiInv). See ../README.md.
# MegaDreifach.Em (the v2 model, grips included) is re-elaborated only because FaceTurn
# and Inverse take faceTurn / inverse from it; it states nothing about v3's card phase.
[[lean_lib]]
name = "MegaDreifachLink"
srcDir = "../../megadreifach/lean"
roots = [
