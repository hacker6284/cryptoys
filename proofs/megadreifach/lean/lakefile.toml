name = "MegaDreifach"
version = "0.1.0"
defaultTargets = ["megadreifach"]

# Link 2: import emitted Lean as a path dependency. Do not edit Generated/.
[[require]]
name = "sudo"
path = "Generated"

# `#audit_all` for Axioms.lean / AxiomsHeavy.lean: the shared core-only audit
# package (also required by proofs/doubledeal/security). Gate:
# proofs/doubledeal/check_axioms.py megadreifach[-heavy].
[[require]]
name = "audit"
path = "../../audit"

[[lean_lib]]
name = "MegaDreifach"

[[lean_exe]]
name = "megadreifach"
root = "Main"

# Heavy kernel witnesses (the 8 hash KATs, ~8 min of `decide!`). Not a default
# target: built and audited by the separate `megadreifach-heavy` job
# (proofs-heavy.yml).
[[lean_lib]]
name = "MegaDreifachHeavy"
