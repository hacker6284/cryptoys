name = "ScrambleV2"
version = "0.1.0"
defaultTargets = ["ScrambleV2"]

[[require]]
name = "sudo"
path = "Generated"

[[require]]
name = "audit"
path = "../../audit"

[[lean_lib]]
name = "ScrambleV2"

# The MegaDreifach Link 2 runtime lemmas (`MegaDreifach.Link2.Embed`, `.Sudo`,
# `.Loop`: `embed`, `FitsLen`, the SudoRt arithmetic and the `chain_loop` drivers),
# elaborated here against this package's own emitted SudoRt (identical to
# MegaDreifach's). Only modules that import nothing but SudoRt resolve: Scramble's
# Generated/ has no Megadreifach module. Not a build target: `globs` only lets
# `import MegaDreifach.…` resolve to srcDir; lake builds exactly what ScrambleV2 imports.
[[lean_lib]]
name = "MegaDreifachLink"
srcDir = "../../megadreifach/lean"
roots = []
globs = ["MegaDreifach.+"]
